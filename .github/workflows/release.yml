name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check:workspace-ui
      - run: npm run legal:notices
      - run: npx tsc -p tsconfig.main.json --noEmit
      - run: npx tsc -p tsconfig.preload.json --noEmit
      - run: npx tsc -p tsconfig.renderer.json --noEmit
      - run: npm run build

  build-macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            executable_architecture: arm64
          - runner: macos-15-intel
            architecture: x64
            executable_architecture: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci
      - run: npm run legal:notices
      - run: npm run build

      - name: Validate macOS entitlements
        run: plutil -lint resources/macos-entitlements.plist

      - name: Build ad-hoc signed macOS DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --${{ matrix.architecture }} --publish never

      - name: Verify app bundle, architecture, signature, associations, and notices
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find release -type d -name 'BeiyeMD.app' -print -quit)"
          test -n "$app_path"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_details="$(codesign -dvvv "$app_path" 2>&1)"
          printf '%s\n' "$signature_details"
          grep -q 'Signature=adhoc' <<< "$signature_details"

          executable_architectures="$(lipo -archs "$app_path/Contents/MacOS/BeiyeMD")"
          test "$executable_architectures" = "${{ matrix.executable_architecture }}"

          info_plist="$app_path/Contents/Info.plist"
          plutil -extract CFBundleDocumentTypes xml1 -o - "$info_plist" | grep -q '<string>md</string>'
          plutil -extract CFBundleDocumentTypes xml1 -o - "$info_plist" | grep -q '<string>markdown</string>'
          test -f "$app_path/Contents/Resources/THIRD_PARTY_NOTICES.txt"
          test -f "$app_path/Contents/Resources/ELECTRON_THIRD_PARTY_NOTICES.html"

      - name: Smoke-launch the app bundle
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find release -type d -name 'BeiyeMD.app' -print -quit)"
          "$app_path/Contents/MacOS/BeiyeMD" --disable-gpu > macos-smoke.log 2>&1 &
          app_pid=$!
          sleep 8
          kill -0 "$app_pid"
          kill "$app_pid" || true
          wait "$app_pid" || true

      - name: Mount and verify the DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find release -maxdepth 1 -name 'BeiyeMD-*-mac-${{ matrix.architecture }}.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          test -d "$mount_dir/BeiyeMD.app"
          codesign --verify --deep --strict --verbose=2 "$mount_dir/BeiyeMD.app"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-${{ matrix.architecture }}
          path: release/BeiyeMD-*-mac-${{ matrix.architecture }}.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci
      - run: npm run legal:notices
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'BeiyeMD-Setup-*-Windows-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated.' }
          if ($installer.Length -lt 10MB) { throw 'Windows installer is unexpectedly small.' }

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-x64
          path: release/BeiyeMD-Setup-*-Windows-x64.exe
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - build-macos
      - build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: artifacts
        run: |
          set -euo pipefail
          files=( *.dmg *.exe )
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
